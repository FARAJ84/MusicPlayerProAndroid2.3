name: Build Gingerbread APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Set up old Android SDK components
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd "$HOME/android-sdk/cmdline-tools"
          curl -sSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Install Build-Tools 17.0.0 via sdkmanager
        run: |
          yes | sdkmanager --sdk_root="$HOME/android-sdk" "build-tools;17.0.0" || true
          ls "$HOME/android-sdk/build-tools" || echo "build-tools dir missing"

      - name: Manually install SDK Platform android-10
        run: |
          mkdir -p "$HOME/android-sdk/platforms"
          cd /tmp
          curl -sSL -o android-10.zip https://dl.google.com/android/repository/android-2.3.3_r02-linux.zip
          unzip -q android-10.zip
          mv android-2.3.3_r02 "$HOME/android-sdk/platforms/android-10"
          ls "$HOME/android-sdk/platforms/android-10"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayerPro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
