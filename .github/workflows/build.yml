name: Build Gingerbread APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Set ANDROID_HOME environment variable
        run: |
          mkdir -p "$HOME/android-sdk"
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Manually install Build-Tools 19.1.0
        run: |
          mkdir -p "$HOME/android-sdk/build-tools"
          cd /tmp
          curl -f -sSL -o build-tools-19.zip https://dl.google.com/android/repository/build-tools_r19.1-linux.zip
          echo "--- curl exit code: $? ---"
          ls -la build-tools-19.zip
          unzip -q build-tools-19.zip -d bt_extracted
          echo "--- extracted contents: ---"
          ls -la bt_extracted
          BT_DIR=$(ls bt_extracted | head -n 1)
          mv "bt_extracted/$BT_DIR" "$HOME/android-sdk/build-tools/19.1.0"
          ls "$HOME/android-sdk/build-tools/19.1.0"

      - name: Manually install SDK Platform android-10
        run: |
          mkdir -p "$HOME/android-sdk/platforms"
          cd /tmp
          curl -f -sSL -o android-10.zip https://dl.google.com/android/repository/android-2.3.3_r02-linux.zip
          echo "--- curl exit code: $? ---"
          ls -la android-10.zip
          unzip -q android-10.zip -d extracted
          echo "--- extracted contents: ---"
          ls -la extracted
          EXTRACTED_DIR=$(ls extracted | head -n 1)
          mv "extracted/$EXTRACTED_DIR" "$HOME/android-sdk/platforms/android-10"
          ls "$HOME/android-sdk/platforms/android-10"

      - name: Verify SDK contents before build
        run: |
          echo "--- ANDROID_HOME: $ANDROID_HOME ---"
          find "$HOME/android-sdk" -maxdepth 3

      - name: Install 32-bit compatibility libraries for old aapt
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libc6:i386 libstdc++6:i386 zlib1g:i386
          sudo apt-get install -y libtinfo5:i386 || sudo apt-get install -y libncurses6:i386 || echo "no ncurses-compat package found, continuing"

      - name: Ensure build-tools binaries are executable
        run: |
          chmod +x "$HOME/android-sdk/build-tools/19.1.0/"*
          "$HOME/android-sdk/build-tools/19.1.0/aapt" version

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Find generated APK files
        run: find app/build -iname "*.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayerPro-debug-apk
          path: app/build/**/*.apk
