name: Build Gingerbread APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Set ANDROID_HOME environment variable
        run: |
          mkdir -p "$HOME/android-sdk"
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Manually install Build-Tools 17.0.0
        run: |
          mkdir -p "$HOME/android-sdk/build-tools"
          cd /tmp
          curl -f -sSL -o build-tools-17.zip https://dl.google.com/android/repository/build-tools_r17-linux.zip
          echo "--- curl exit code: $? ---"
          ls -la build-tools-17.zip
          unzip -q build-tools-17.zip -d bt_extracted
          echo "--- extracted contents: ---"
          ls -la bt_extracted
          BT_DIR=$(ls bt_extracted | head -n 1)
          mv "bt_extracted/$BT_DIR" "$HOME/android-sdk/build-tools/17.0.0"
          ls "$HOME/android-sdk/build-tools/17.0.0"

      - name: Manually install SDK Platform android-10
        run: |
          mkdir -p "$HOME/android-sdk/platforms"
          cd /tmp
          curl -f -sSL -o android-10.zip https://dl.google.com/android/repository/android-2.3.3_r02-linux.zip
          echo "--- curl exit code: $? ---"
          ls -la android-10.zip
          unzip -q android-10.zip -d extracted
          echo "--- extracted contents: ---"
          ls -la extracted
          EXTRACTED_DIR=$(ls extracted | head -n 1)
          mv "extracted/$EXTRACTED_DIR" "$HOME/android-sdk/platforms/android-10"
          ls "$HOME/android-sdk/platforms/android-10"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayerPro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
