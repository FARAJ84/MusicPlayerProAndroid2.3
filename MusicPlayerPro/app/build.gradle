apply plugin: 'com.android.application'

android {
    compileSdkVersion 10
    buildToolsVersion "17.0.0"

    defaultConfig {
        applicationId "com.taha.musicplayerpro"
        minSdkVersion 9
        targetSdkVersion 10
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_6
        targetCompatibility JavaVersion.VERSION_1_6
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
